[program:omniq_ftv4_after_r1]
command=/workspace/omniq/scripts/queue_ftv4_after_r1.sh
directory=/workspace/omniq
user=root
autostart=true
autorestart=false
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/omniq/runs/v4_chain/ftv4_after_r1.supervisor.log
stderr_logfile=/workspace/omniq/runs/v4_chain/ftv4_after_r1.supervisor.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stopwaitsecs=10
