[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-q"
version = "0.1.0"
description = "Omni Q core: objective -> capability graph -> placement -> execution -> verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# Intel online challenge stack — MuJoCo dual-SO-101 sim, LeRobot policy
# training, OpenVINO edge export/quantization/inference. See docs/challenge-briefs/.
# NOTE: lerobot pulls in a CPU-only torch by default. On a machine with an
# NVIDIA GPU, follow up with a matching CUDA build from
# https://download.pytorch.org/whl/<cuXXX> for local training — see
# integrations/intel/README.md.
intel = [
    "mujoco>=3.13",
    "openvino>=2026.3",
    "lerobot>=0.6",
    "optimum-intel[openvino]>=2.1",
    "nncf>=3.3",
    "psutil>=5.9",  # integrations/intel/scripts/profile_yolo_openvino.py
    "opencv-python>=4.9",  # src/omni_q/vision.py -- letterbox/NMS + real-camera capture
    "pyyaml>=6.0",  # src/omni_q/vision.py -- OpenVINODetector reads exported metadata.yaml
    "imageio-ffmpeg>=0.5",  # integrations/intel/scripts/_recording.py -- H.264 demo videos (falls back to mp4v without it)
]

# Speechmatics realtime transport (integrations/speechmatics/). The core voice
# boundary in src/omni_q/voice.py needs none of this -- it takes plain payload
# mappings -- and the offline replay path runs on the stdlib alone, so this is
# only needed to talk to the live service. Key comes from SPEECHMATICS_API_KEY.
speechmatics = [
    "websockets>=12",  # realtime v2 websocket client
]
# Optional higher-level Voice SDK path: smart_turn, speaker focus, and
# segmented Voice API events. The bridge imports this lazily so raw replay and
# the existing websocket transport do not acquire the dependency.
speechmatics-voice = [
    "speechmatics-voice[smart]>=0.2.8",
]
# Microphone capture on top of the above; needs PortAudio present on the host,
# which is why it is separate from the file/replay path.
speechmatics-mic = [
    "websockets>=12",
    "sounddevice>=0.4",
]
# Actual Unitree G1 12-DOF TorchScript locomotion policy in MuJoCo.  The
# policy/MJCF checkout is external and is not committed to this repository.
g1 = [
    "mujoco>=3.2",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "torch>=2.0",
]
# Optional SmolVLA inference and LeRobot demonstration recording.  The
# checkpoint, dataset, and promotion evidence remain external artifacts.
smolvla = [
    "lerobot[smolvla]>=0.6.1",
    "numpy>=1.24",
    "torch>=2.0",
]

[project.scripts]
omni-q-demo = "omni_q.demo:main"
omni-q-server = "omni_q.server:main"
omni-q-intel-demo = "omni_q.demo_intel_sim:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
