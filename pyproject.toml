[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-q"
version = "0.1.0"
description = "Omni Q core: objective -> capability graph -> placement -> execution -> verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# Intel online challenge stack — MuJoCo dual-SO-101 sim, LeRobot policy
# training, OpenVINO edge inference. See docs/challenge-briefs/.
intel = ["mujoco>=3.13", "openvino>=2026.3", "lerobot>=0.6"]

[project.scripts]
omni-q-demo = "omni_q.demo:main"
omni-q-server = "omni_q.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
